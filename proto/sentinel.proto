syntax = "proto3";

package sentinel.v1;

service Ingest {
  rpc SendMetrics(MetricsRequest) returns (Ack);
  rpc SendLogs(LogsRequest) returns (Ack);
}

// Identity is NOT in the message — it is derived from the authenticated
// X-API-KEY on the server side. Do not add identity fields here.
message MetricsRequest {
  MetricPoint point = 1;
}

message MetricPoint {
  int64 timestamp_ms = 1;
  double cpu_percent = 2;
  uint64 mem_used_bytes = 3;
  uint64 mem_total_bytes = 4;
  uint64 disk_used_bytes = 5;
  uint64 disk_total_bytes = 6;
  double load_1m = 7;
  double load_5m = 8;
  uint64 net_rx_bytes_total = 9;
  uint64 net_tx_bytes_total = 10;
}

message LogsRequest {
  repeated LogLine lines = 1;
  // Structured entries already parsed, filtered, and classified by the
  // agent's log pipeline. The hub stores them as-is: no parsing or
  // classification happens server-side (see AGENTS.md separation of
  // concerns).
  repeated ParsedLogEntry parsed_lines = 2;
}

message LogLine {
  int64 timestamp_ms = 1;
  string container = 2;
  string stream = 3;
  string message = 4;
}

// One InsertLogEntry produced by the agent-side pipeline. Service
// identity is carried by name/unit_type (the agent has no database; the
// hub owns services-row IDs).
message ParsedLogEntry {
  int64 timestamp_ms = 1;
  string level = 2;
  string message = 3;
  optional string raw_line = 4;
  optional string client_ip = 5;
  optional string request_path = 6;
  optional int32 status_code = 7;
  optional int64 response_time_ms = 8;
  bool is_noise = 9;
  optional string noise_reason = 10;
  string threat_level = 11;
  repeated string threat_categories = 12;
  string service_name = 13;
  string service_unit_type = 14;
  optional string virtual_host = 15;
}

message Ack {
  bool accepted = 1;
  uint32 count = 2;
}
